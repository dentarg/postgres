name: Update the v1 branch when a release is published

permissions:
  contents: write
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - run: git push origin HEAD:refs/heads/v1
